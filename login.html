<!doctype html>
<script>
/* Demo account seeder — place this near the top of login.html or home.html.
   It only creates the account if it doesn't already exist.
   Replace demoEmail / demoPass with your real email and password if you want.
*/
(function seedDemoAccount(){
  const demoEmail = 'demo@youremail.com';    // <- replace with your email
  const demoPass  = 'DemoPass123';           // <- replace with your password
  const users = JSON.parse(localStorage.getItem('nf_users') || '{}');
  if (!users[demoEmail]) {
    users[demoEmail] = {
      name: 'Demo User',
      password: btoa(demoPass),
      subscribed: true,
      plan: '549',
      createdAt: Date.now(),
      txn: 'DEMO-' + Math.random().toString(36).slice(2,8).toUpperCase()
    };
    localStorage.setItem('nf_users', JSON.stringify(users));
    console.log('Demo account created:', demoEmail);
  } else {
    // ensure it's subscribed so you can log in immediately:
    users[demoEmail].subscribed = true;
    users[demoEmail].plan = users[demoEmail].plan || '549';
    localStorage.setItem('nf_users', JSON.stringify(users));
    console.log('Demo account ensured subscribed:', demoEmail);
  }
})();
</script>


<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Sign In — Netflix Demo</title>
  <style>
    :root{--bg:#000;--fg:#fff;--muted:#9a9a9a;--accent:#e50914}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,Arial,sans-serif;background:linear-gradient(180deg,#000,#111);color:var(--fg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
    .card{background:#0d0d0d;padding:2rem;border-radius:.6rem;width:420px}
    h2{margin-bottom:1rem}
    label{display:block;color:var(--muted);font-size:.9rem;margin-top:.6rem}
    input{width:100%;padding:.8rem;border-radius:.45rem;border:none;margin-top:.35rem}
    .row{display:flex;gap:.6rem;margin-top:1rem}
    .btn{flex:1;background:var(--accent);color:#fff;padding:.7rem;border-radius:.45rem;border:none;cursor:pointer;font-weight:700}
    .link{display:block;text-align:center;margin-top:1rem;color:var(--muted)}
  </style>
</head>
<body>
  <div class="card">
    <h2>Sign In</h2>

    <form id="loginForm">
      <label>Email</label>
      <input id="email" type="email" required placeholder="you@example.com" />
      <label>Password</label>
      <input id="password" type="password" required placeholder="Password" />
      <div class="row">
        <button class="btn" type="submit">Sign In</button>
      </div>
    </form>

    <div class="link">
      New here? <a href="signup.html" style="color:var(--accent)">Create an account</a>
    </div>
  </div>

  <script>
    function loadUsers(){ return JSON.parse(localStorage.getItem('nf_users') || '{}'); }
    function obfuscate(p){ return btoa(p); }

    document.getElementById('loginForm').addEventListener('submit', function(e){
      e.preventDefault();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;

      const users = loadUsers();
      const user = users[email];
      if (!user) {
        if (confirm('No account found for that email. Would you like to sign up?')) location.href = 'signup.html';
        return;
      }

      if (user.password !== obfuscate(password)) {
        alert('Incorrect password.');
        return;
      }

      if (!user.subscribed) {
        if (confirm('Your account has not paid a subscription. Go to payment?')) {
          // set pending and go to payment
          localStorage.setItem('nf_pending_email', email);
          location.href = 'payment.html';
        }
        return;
      }

      // all good: set current session and go to index (main page)
      localStorage.setItem('nf_current_user', email);
      location.href = 'index.html';
    });
  </script>
</body>
</html>
